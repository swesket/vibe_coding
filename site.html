<script>
  const SITE_ORIGIN = 'https://vibe-coding-6ou.pages.dev';
  const wrap = document.getElementById('detailWrap');
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const site = (typeof sites !== 'undefined') ? sites.find(s => s.url === id) : null;

  // i18n labels for the detail page chrome (per language)
  const L = {
    ko: { back:'사이트 목록', visit:'공식 사이트 방문', price:'가격대', shipping:'배송·관세', pros:'장점', cons:'참고할 점', bestFor:'이런 분께 추천', verdict:'DIGGING 에디터 총평', related:'같은 카테고리의 다른 사이트', notFound:'사이트를 찾을 수 없습니다', notFoundDesc:'요청하신 사이트 정보가 없습니다. 전체 목록에서 다시 찾아보세요.', browseAll:'전체 사이트 보기' },
    en: { back:'All Sites', visit:'Visit Official Site', price:'Price Range', shipping:'Shipping & Duties', pros:'Pros', cons:'Things to Note', bestFor:'Best For', verdict:"DIGGING Editor's Verdict", related:'Other sites in this category', notFound:'Site not found', notFoundDesc:'We could not find that site. Try browsing the full directory.', browseAll:'Browse all sites' },
    zh: { back:'全部网站', visit:'访问官方网站', price:'价格区间', shipping:'配送与关税', pros:'优点', cons:'注意事项', bestFor:'推荐人群', verdict:'DIGGING 编辑点评', related:'同类别的其他网站', notFound:'未找到该网站', notFoundDesc:'找不到该网站信息，请返回完整列表重新查找。', browseAll:'查看全部网站' },
    ja: { back:'サイト一覧', visit:'公式サイトへ', price:'価格帯', shipping:'配送・関税', pros:'メリット', cons:'注意点', bestFor:'おすすめの方', verdict:'DIGGING 編集部の総評', related:'同じカテゴリの他サイト', notFound:'サイトが見つかりません', notFoundDesc:'お探しのサイト情報がありません。一覧から再度お探しください。', browseAll:'すべてのサイトを見る' }
  };

  function esc(str){ return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function pick(obj, lang){ if(!obj) return null; return obj[lang] || obj.ko; }

  function renderDetail() {
    const lang = (typeof currentLang !== 'undefined') ? currentLang : 'ko';
    const t = L[lang] || L.ko;

    if (!site) {
      document.title = t.notFound + ' — DIGGING';
      wrap.innerHTML = `<p class="breadcrumb"><a href="sites.html">${t.back}</a></p>
        <div class="detail-hero"><h1>${t.notFound}</h1></div>
        <p class="detail-lead">${t.notFoundDesc}</p>
        <a class="detail-cta" href="sites.html">${t.browseAll} →</a>`;
      return;
    }

    const desc = pick(site.desc, lang);
    const tags = pick(site.tags, lang) || [];
    const d = (typeof siteDetails !== 'undefined') ? siteDetails[site.url] : null;

    // ── meta / title / canonical (dynamic) ──
    const canonical = `${SITE_ORIGIN}/site?id=${encodeURIComponent(site.url)}`;
    const metaDescText = desc.length > 155 ? desc.slice(0, 152) + '…' : desc;
    document.title = `${site.name} 리뷰 — DIGGING`;
    document.documentElement.lang = lang;
    setMeta('metaDesc', metaDescText, 'content');
    setMeta('ogTitle', `${site.name} — DIGGING`, 'content');
    setMeta('ogDesc', metaDescText, 'content');
    setMeta('ogUrl', canonical, 'content');
    document.getElementById('canonicalLink').setAttribute('href', canonical);

    // ── JSON-LD ──
    const ld = {
      "@context": "https://schema.org",
      "@type": "Review",
      "itemReviewed": { "@type": "Organization", "name": site.name, "url": site.href },
      "author": { "@type": "Organization", "name": "DIGGING" },
      "reviewBody": desc,
      "url": canonical
    };
    document.getElementById('detailJsonLd').textContent = JSON.stringify(ld);

    // ── facts ──
    let factsHtml = '';
    if (d) {
      const price = pick(d.priceRange, lang);
      const ship = pick(d.shipping, lang);
      const best = pick(d.bestFor, lang);
      if (price) factsHtml += `<div class="detail-fact"><h4>${t.price}</h4><p>${esc(price)}</p></div>`;
      if (ship)  factsHtml += `<div class="detail-fact"><h4>${t.shipping}</h4><p>${esc(ship)}</p></div>`;
      if (best)  factsHtml += `<div class="detail-fact"><h4>${t.bestFor}</h4><p>${esc(best)}</p></div>`;
    }
    const factsBlock = factsHtml ? `<div class="detail-facts">${factsHtml}</div>` : '';

    // ── pros / cons ──
    let pcBlock = '';
    if (d && (d.pros || d.cons)) {
      const pros = (pick(d.pros, lang) || []).map(x => `<li>${esc(x)}</li>`).join('');
      const cons = (pick(d.cons, lang) || []).map(x => `<li>${esc(x)}</li>`).join('');
      pcBlock = `<div class="detail-proscons">
        ${pros ? `<div class="detail-col pros"><h4>${t.pros}</h4><ul>${pros}</ul></div>` : ''}
        ${cons ? `<div class="detail-col cons"><h4>${t.cons}</h4><ul>${cons}</ul></div>` : ''}
      </div>`;
    }

    // ── verdict ──
    let verdictBlock = '';
    if (d) {
      const v = pick(d.verdict, lang);
      if (v) verdictBlock = `<div class="detail-verdict"><h3>${t.verdict}</h3><p>${esc(v)}</p></div>`;
    }

    // ── related (same category) ──
    const related = sites.filter(s => s.cat === site.cat && s.url !== site.url).slice(0, 3);
    let relatedBlock = '';
    if (related.length) {
      const cards = related.map(s => {
        const rd = pick(s.desc, lang);
        const short = rd.length > 90 ? rd.slice(0, 88) + '…' : rd;
        return `<a class="card" href="site?id=${encodeURIComponent(s.url)}">
          <div class="card-head"><div class="favicon">${s.emoji}</div><div><div class="card-title">${esc(s.name)}</div><div class="card-url">${esc(s.url)}</div></div></div>
          <p class="card-desc">${esc(short)}</p>
          <div class="card-footer"><div class="tags"></div><span class="arrow">→</span></div></a>`;
      }).join('');
      relatedBlock = `<section class="detail-related"><h3>${t.related}</h3><div class="grid">${cards}</div></section>`;
    }

    wrap.innerHTML = `
      <p class="breadcrumb"><a href="sites.html">${t.back}</a><span>/</span>${esc(site.name)}</p>
      <div class="detail-hero">
        <div class="favicon">${site.emoji}</div>
        <div>
          <h1>${esc(site.name)}</h1>
          <div class="detail-url">${esc(site.url)}</div>
        </div>
      </div>
      <div class="detail-tags">${tags.map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div>
      <p class="detail-lead">${esc(desc)}</p>
      <a class="detail-cta" href="${site.href}" target="_blank" rel="noopener noreferrer nofollow sponsored">${t.visit} →</a>
      ${factsBlock}
      ${pcBlock}
      ${verdictBlock}
      ${relatedBlock}
    `;
  }

  function setMeta(id, value, attr){ const el = document.getElementById(id); if (el) el.setAttribute(attr, value); }

  document.addEventListener('langchange', renderDetail);
  // initial render (shared.js dispatches langchange on load, but render immediately too as a fallback)
  renderDetail();
</script>
